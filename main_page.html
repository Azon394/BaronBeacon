<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>С Днём Рождения, любимая 🎂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-1: #1a0b2e;
    --bg-2: #2d1b4e;
    --bg-3: #5a2c5a;
    --accent: #ff6b9d;
    --accent-2: #ffc8dd;
    --gold: #ffd166;
    --text: #f5f0f7;
    --text-dim: #c9b8d4;
    --card-bg: rgba(255, 255, 255, 0.06);
    --card-border: rgba(255, 255, 255, 0.12);
  }

  html, body {
    height: 100%;
    font-family: 'Inter', sans-serif;
    color: var(--text);
    overflow-x: hidden;
  }

  body {
    background: radial-gradient(ellipse at top, var(--bg-3) 0%, var(--bg-2) 40%, var(--bg-1) 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
  }

  /* Плавающие элементы на фоне */
  .bg-elements {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }

  .float-el {
    position: absolute;
    opacity: 0.15;
    animation: floatUp linear infinite;
  }

  @keyframes floatUp {
    0%   { transform: translateY(100vh) scale(0.5) rotate(0deg); opacity: 0; }
    10%  { opacity: 0.2; }
    90%  { opacity: 0.2; }
    100% { transform: translateY(-10vh) scale(1.2) rotate(360deg); opacity: 0; }
  }

  /* Контейнер карточки */
  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 580px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 28px;
    padding: 48px 40px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow:
      0 20px 60px rgba(0, 0, 0, 0.4),
      inset 0 1px 0 rgba(255, 255, 255, 0.08);
    text-align: center;
    transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
                opacity 0.4s ease;
  }

  .card.hidden { display: none; }

  .card.fade-out {
    opacity: 0;
    transform: translateY(-20px) scale(0.95);
  }

  .card.fade-in {
    animation: fadeIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px) scale(0.95); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .step-indicator {
    display: inline-block;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent-2);
    margin-bottom: 20px;
    font-weight: 500;
    opacity: 0.8;
  }

  .emoji-big {
    font-size: 56px;
    display: block;
    margin-bottom: 20px;
    animation: pulse 2.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.1); }
  }

  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(28px, 6vw, 40px);
    font-weight: 600;
    line-height: 1.25;
    margin-bottom: 16px;
    background: linear-gradient(135deg, #fff 0%, var(--accent-2) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  p.subtitle {
    font-size: 16px;
    line-height: 1.65;
    color: var(--text-dim);
    margin-bottom: 32px;
    font-weight: 300;
  }

  .buttons {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  button {
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    font-weight: 500;
    padding: 16px 24px;
    border-radius: 16px;
    border: none;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
    overflow: hidden;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent) 0%, #d63384 100%);
    color: #fff;
    box-shadow: 0 8px 24px rgba(255, 107, 157, 0.35);
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(255, 107, 157, 0.5);
  }

  .btn-primary:active { transform: translateY(0) scale(0.98); }

  .btn-secondary {
    background: rgba(255, 255, 255, 0.08);
    color: var(--text);
    border: 1px solid var(--card-border);
  }

  .btn-secondary:hover {
    background: rgba(255, 255, 255, 0.14);
    transform: translateY(-2px);
  }

  /* Финальный экран */
  .final-hearts {
    font-size: 40px;
    margin: 16px 0;
    animation: pulse 1.8s ease-in-out infinite;
  }

  .letter {
    background: linear-gradient(135deg,
      rgba(255, 107, 157, 0.12) 0%,
      rgba(255, 209, 102, 0.08) 100%);
    border: 1px solid rgba(255, 107, 157, 0.25);
    border-radius: 20px;
    padding: 28px 24px;
    margin: 24px 0;
    text-align: left;
    line-height: 1.75;
    font-size: 15.5px;
    color: var(--text);
    font-weight: 300;
  }

  .letter p { margin-bottom: 14px; }
  .letter p:last-child { margin-bottom: 0; }

  .letter .signature {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-style: italic;
    text-align: right;
    color: var(--accent-2);
    margin-top: 16px;
  }

  .wish-list {
    text-align: left;
    margin: 20px 0;
    padding: 0;
    list-style: none;
  }

  .wish-list li {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 10px 0;
    font-size: 15px;
    color: var(--text-dim);
    line-height: 1.5;
  }

  .wish-list li span:first-child {
    font-size: 20px;
    flex-shrink: 0;
    line-height: 1.2;
  }

  .reset-link {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 13px;
    cursor: pointer;
    margin-top: 20px;
    text-decoration: underline;
    text-decoration-color: rgba(201, 184, 212, 0.4);
    text-underline-offset: 4px;
    padding: 4px 8px;
  }

  .reset-link:hover { color: var(--accent-2); }

  /* Прогресс-бар */
  .progress {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 28px 28px 0 0;
    overflow: hidden;
  }

  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--gold));
    width: 0%;
    transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    border-radius: 28px;
  }

  /* Конфетти */
  .confetti {
    position: fixed;
    top: -10px;
    font-size: 22px;
    animation: confettiFall linear forwards;
    z-index: 100;
    pointer-events: none;
  }

  @keyframes confettiFall {
    0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  @media (max-width: 480px) {
    .card { padding: 36px 24px; border-radius: 22px; }
    .emoji-big { font-size: 44px; }
    button { padding: 14px 20px; font-size: 15px; }
    .letter { padding: 22px 18px; font-size: 15px; }
  }
</style>
</head>
<body>

<div class="bg-elements" id="bgElements"></div>

<main id="app">
  <!-- Экраны генерируются через JS -->
</main>

<script>
/* ============================================================
   СЦЕНАРИЙ ПОЗДРАВЛЕНИЯ
   Вопросы про день рождения, знакомство и общие моменты.
   ============================================================ */
const screens = {
  start: {
    emoji: "🎂",
    step: "Особенный день",
    title: "С Днём Рождения, любимая",
    subtitle: "У меня для тебя кое-что есть.<br>Но сначала — пара вопросов 😊",
    options: [
      { label: "Открыть 💫", next: "q1" }
    ]
  },

  q1: {
    emoji: "📅",
    step: "Вопрос 1 из 4",
    title: "Помнишь день, когда мы познакомились?",
    subtitle: "Иногда я прокручиваю его в голове. А ты?",
    options: [
      { label: "Конечно помню! 💕", next: "q1b", variant: "primary" },
      { label: "Смутно припоминаю 😅", next: "q1b", variant: "secondary" },
      { label: "Напомни мне 😏", next: "q1b", variant: "secondary" }
    ]
  },

  q1b: {
    emoji: "✨",
    step: "Вопрос 1 из 4",
    title: "А каким был тот день?",
    subtitle: "Выбери, что больше всего запомнилось.",
    options: [
      { label: "Волнение и бабочки 🦋", next: "q2", variant: "primary" },
      { label: "Смех и лёгкость 😊", next: "q2", variant: "primary" },
      { label: "Сразу понял(а) — это судьба 🌟", next: "q2", variant: "primary" }
    ]
  },

  q2: {
    emoji: "🎁",
    step: "Вопрос 2 из 4",
    title: "Что для тебя важнее всего в этот день?",
    subtitle: "Хочу, чтобы сегодня было именно так, как ты хочешь.",
    options: [
      { label: "Тёплые слова и внимание 💌", next: "q3", variant: "primary" },
      { label: "Сюрпризы и подарки 🎀", next: "q3", variant: "primary" },
      { label: "Провести день вместе 🥰", next: "q3", variant: "primary" }
    ]
  },

  q3: {
    emoji: "🌟",
    step: "Вопрос 3 из 4",
    title: "А помнишь наш самый счастливый момент?",
    subtitle: "У меня он перед глазами прямо сейчас.",
    options: [
      { label: "Наша первая прогулка 🌙", next: "q4", variant: "primary" },
      { label: "Первый совместный рассвет ☀️", next: "q4", variant: "primary" },
      { label: "Какой-то другой — он в моём сердце 💖", next: "q4", variant: "primary" }
    ]
  },

  q4: {
    emoji: "💫",
    step: "Последний вопрос",
    title: "А если бы можно было загадать одно желание?",
    subtitle: "Знаешь, что я загадал бы?",
    options: [
      { label: "Чтобы мы были вместе всегда 🌹", next: "final", variant: "primary" },
      { label: "Чтобы ты улыбалась каждый день 😊", next: "final", variant: "primary" },
      { label: "Узнать твоё желание 💭", next: "final", variant: "primary" }
    ]
  },

  final: {
    emoji: "🎉",
    step: "С Днём Рождения!",
    title: "Ты — моё самое большое чудо",
    subtitle: "Спасибо, что ты есть. Это письмо — для тебя.",
    final: true
  }
};

/* ============================================================
   ЛОГИКА
   ============================================================ */
const app = document.getElementById('app');
let currentScreen = 'start';

function renderScreen(screenId, animate = true) {
  const screen = screens[screenId];
  if (!screen) return;

  // Прогресс
  const totalSteps = 5;
  const stepMap = { start: 0, q1: 1, q1b: 1, q2: 2, q3: 3, q4: 4, final: 5 };
  const progress = Math.min((stepMap[screenId] || 0) / totalSteps * 100, 100);

  const card = document.createElement('div');
  card.className = 'card' + (animate ? ' fade-in' : '');

  let optionsHTML = '';
  if (screen.options) {
    optionsHTML = `<div class="buttons">` +
      screen.options.map(opt =>
        `<button class="btn-${opt.variant || 'primary'}" data-next="${opt.next}">${opt.label}</button>`
      ).join('') +
      `</div>`;
  }

  let finalHTML = '';
  if (screen.final) {
    finalHTML = `
      <div class="final-hearts">🎂 💖 🎈</div>

      <div class="letter">
        <p>Любимая,</p>
        <p>сегодня твой день, и я хочу, чтобы ты знала: каждый день рядом с тобой — для меня праздник. Ты делаешь мир ярче, теплее и добрее просто тем, что ты в нём есть.</p>
        <p>Спасибо за твою улыбку, за твоё тепло, за все моменты, которые мы провели вместе — и за те, что ещё впереди.</p>
        <p>Я хочу, чтобы в этом году сбылось всё, о чём ты мечтаешь. А я буду рядом — помогать, поддерживать и любить.</p>
        <div class="signature">С любовью, твой(я) ❤️</div>
      </div>

      <ul class="wish-list">
        <li><span>🌸</span><span>Пусть каждый день приносит радость</span></li>
        <li><span>🌟</span><span>Пусть мечты сбываются легко и красиво</span></li>
        <li><span>💫</span><span>Пусть рядом всегда будут люди, которые тебя любят</span></li>
        <li><span>🎁</span><span>А подарок от меня — уже совсем скоро 😉</span></li>
      </ul>
    `;
  }

  card.innerHTML = `
    <div class="progress"><div class="progress-bar" style="width: ${progress}%"></div></div>
    <span class="step-indicator">${screen.step}</span>
    <span class="emoji-big">${screen.emoji}</span>
    <h1>${screen.title}</h1>
    <p class="subtitle">${screen.subtitle}</p>
    ${optionsHTML}
    ${finalHTML}
    ${screen.final ? '<button class="reset-link">Пройти заново</button>' : ''}
  `;

  const oldCard = app.querySelector('.card');
  if (oldCard) {
    oldCard.classList.add('fade-out');
    setTimeout(() => oldCard.remove(), 400);
  }

  setTimeout(() => app.appendChild(card), oldCard ? 200 : 0);

  // Обработчики
  card.querySelectorAll('button[data-next]').forEach(btn => {
    btn.addEventListener('click', () => {
      currentScreen = btn.dataset.next;
      renderScreen(currentScreen);
    });
  });

  const resetBtn = card.querySelector('.reset-link');
  if (resetBtn) {
    resetBtn.addEventListener('click', () => {
      currentScreen = 'start';
      renderScreen('start');
    });
  }

  // Конфетти на финальном экране
  if (screen.final) {
    setTimeout(launchConfetti, 600);
  }
}

/* ============================================================
   КОНФЕТТИ
   ============================================================ */
function launchConfetti() {
  const items = ['🎉', '🎊', '💖', '🌸', '✨', '🎈', '🌟', '💕', '🥳', '🎂'];
  for (let i = 0; i < 40; i++) {
    const el = document.createElement('div');
    el.className = 'confetti';
    el.textContent = items[Math.floor(Math.random() * items.length)];
    el.style.left = Math.random() * 100 + '%';
    el.style.fontSize = (16 + Math.random() * 20) + 'px';
    el.style.animationDuration = (2.5 + Math.random() * 2.5) + 's';
    el.style.animationDelay = (Math.random() * 1.5) + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 6000);
  }
}

/* ============================================================
   ФОНОВЫЕ ЭЛЕМЕНТЫ
   ============================================================ */
(function createBgElements() {
  const container = document.getElementById('bgElements');
  const items = ['🎂', '🎈', '💕', '🌸', '✨', '💖', '🌟', '🎀', '🌹', '💫'];
  const count = 16;

  for (let i = 0; i < count; i++) {
    const el = document.createElement('div');
    el.className = 'float-el';
    el.textContent = items[Math.floor(Math.random() * items.length)];
    el.style.left = Math.random() * 100 + '%';
    el.style.fontSize = (14 + Math.random() * 24) + 'px';
    el.style.animationDuration = (14 + Math.random() * 14) + 's';
    el.style.animationDelay = (Math.random() * 18) + 's';
    container.appendChild(el);
  }
})();

/* ============================================================
   СТАРТ
   ============================================================ */
renderScreen('start', false);
</script>

</body>
</html>
